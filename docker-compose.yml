services:
  api:
    image: ghcr.io/${GITHUB_REPOSITORY:-ivansh/parse_tickets}:latest
    container_name: wordpress-parser-api
    restart: unless-stopped
    # Run as pptruser (UID 10042) from the puppeteer base image
    user: "10042:10042"

    # Bind to localhost only (nginx will proxy)
    ports:
      - "127.0.0.1:3000:3000"

    # Load all environment variables from .env file
    env_file:
      - .env

    # Override specific variables if needed
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0  # Bind to all interfaces inside container
      HEADLESS: "true"
      CLOSE_BROWSER: "true"

    volumes:
      # Persistent storage for parsed data, logs, and bot data
      - ./output:/app/output
      - ./logs:/app/logs
      - ./data:/app/data

    # Security settings
    security_opt:
      - no-new-privileges:true

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

    # Health check
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    name: wordpress-parser-network
