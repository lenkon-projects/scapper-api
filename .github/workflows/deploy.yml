name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  deploy:
    name: Deploy to Production Server
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file from multiline secret
        run: |
          # Create .env file from the multiline ENV_VARS secret
          echo "${{ secrets.ENV_VARS }}" > .env.production

          # Add dynamic variables that change per deployment
          echo "GITHUB_REPOSITORY=${{ github.repository }}" >> .env.production

          # Optional: validate the .env file (remove sensitive output in production)
          echo "=== Environment file created with $(cat .env.production | wc -l) lines ==="

      - name: Copy files to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "docker-compose.yml,.env.production,scripts/setup-docker-cron.sh"
          target: "~/wordpress-parser"

      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd ~/wordpress-parser
            mv .env.production .env

            # Create output and logs directories with proper permissions
            # pptruser in the Puppeteer container has UID 10042
            mkdir -p output logs
            chown -R 10042:10042 output logs
            chmod -R 755 output logs

            # Login to GitHub Container Registry
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Set GITHUB_REPOSITORY environment variable for docker-compose
            export GITHUB_REPOSITORY=${{ github.repository }}

            # Pull latest image
            docker compose pull

            # Stop and remove old containers (with volumes cleanup)
            docker compose down --remove-orphans

            # Remove old images before starting new ones
            docker image prune -af

            # Start new containers with fresh pull
            docker compose up -d --force-recreate --pull always

            # Setup Cron Jobs (must run after containers are started)
            chmod +x setup-docker-cron.sh
            bash setup-docker-cron.sh

            # Clean up unused volumes
            docker volume prune -f

            # Show status
            echo "=== Container Status ==="
            docker compose ps

            echo "=== Recent Logs ==="
            docker compose logs --tail=50

      - name: Health check
        run: |
          echo "Waiting for service to start..."
          sleep 15

          echo "Checking health endpoint..."
          curl -f http://127.0.0.1:3000/api/health || exit 1

          echo "✅ Deployment successful!"
