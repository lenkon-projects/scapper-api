name: Build and Deploy (Alternative with individual secrets)

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  deploy:
    name: Deploy to Production Server
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file from individual secrets
        run: |
          cat << 'EOF' > .env.production
          # WordPress Login Credentials
          WP_LOGIN_URL=${{ secrets.WP_LOGIN_URL }}
          WP_USERNAME=${{ secrets.WP_USERNAME }}
          WP_PASSWORD=${{ secrets.WP_PASSWORD }}

          # Target URLs to parse
          TARGET_URL=${{ secrets.TARGET_URL }}

          # Browser settings
          HEADLESS=true
          TIMEOUT=30000
          CLOSE_BROWSER=true

          # API Configuration
          API_KEY=${{ secrets.API_KEY }}
          API_PORT=3000
          API_HOST=0.0.0.0
          NODE_ENV=production
          API_BASE_URL=https://scrapper.liorizhakidrums.com

          # Job Queue Configuration
          MAX_QUEUE_SIZE=5
          JOB_TIMEOUT_MS=300000
          JOB_CLEANUP_INTERVAL_MS=3600000

          # Rate Limiting
          RATE_LIMIT_WINDOW_MS=60000
          RATE_LIMIT_MAX_REQUESTS=10

          # CORS (optional)
          CORS_ORIGIN=*

          # Logging
          LOG_LEVEL=info

          # Monday.com Configuration
          MONDAY_COM_API_KEY=${{ secrets.MONDAY_COM_API_KEY }}
          MONDAY_COM_BOARD_ID=5086703491
          MONDAY_COM_API_URL=https://api.monday.com/v2
          MONDAY_COM_TIMEOUT=10000
          MONDAY_COM_EVENT_ID_COLUMN=text_mkxy6ra8
          MONDAY_COM_CAPACITY_COLUMN=numeric_mkxst6mx
          MONDAY_COM_TICKETS_SOLD_COLUMN=numeric_mkxsf3c8
          MONDAY_COM_UPDATE_DATE_COLUMN=date_mky2adca

          # Telegram Bot Configuration
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_USER_IDS=126348459,5478143272

          # GitHub Repository (for docker-compose)
          GITHUB_REPOSITORY=${{ github.repository }}
          EOF

      - name: Copy files to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "docker-compose.yml,.env.production"
          target: "/root/wordpress-parser"

      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd /root/wordpress-parser
            mv .env.production .env

            # Create output and logs directories with proper permissions
            # pptruser in the Puppeteer container has UID 10042
            mkdir -p output logs data
            chown -R 10042:10042 output logs data
            chmod -R 755 output logs data

            # Login to GitHub Container Registry
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Set GITHUB_REPOSITORY environment variable for docker-compose
            export GITHUB_REPOSITORY=${{ github.repository }}

            # Pull latest image
            docker compose pull

            # Stop and remove old containers (with volumes cleanup)
            docker compose down --remove-orphans

            # Remove old images before starting new ones
            docker image prune -af

            # Start new containers with fresh pull
            docker compose up -d --force-recreate --pull always

            # Clean up unused volumes
            docker volume prune -f

            # Show status
            echo "=== Container Status ==="
            docker compose ps

            echo "=== Recent Logs ==="
            docker compose logs --tail=50

      - name: Health check
        run: |
          echo "Waiting for service to start..."
          sleep 15

          echo "Checking health endpoint..."
          curl -f https://scrapper.liorizhakidrums.com/api/health || exit 1

          echo "✅ Deployment successful!"
