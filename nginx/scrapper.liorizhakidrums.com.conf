

# Upstream configuration
upstream wordpress_parser_api {
    server 127.0.0.1:3000;
    keepalive 32;
}

# HTTP server - will work initially, then certbot will add HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name scrapper.liorizhakidrums.com;

    # Logging
    access_log /var/log/nginx/scrapper.liorizhakidrums.com.access.log;
    error_log /var/log/nginx/scrapper.liorizhakidrums.com.error.log warn;

    # Client body size
    client_max_body_size 10M;

    # Timeouts (long for parsing operations)
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # Root location - general API endpoints
    location / {
        proxy_pass http://wordpress_parser_api;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Keepalive
        proxy_set_header Connection "";
    }

    # Parse endpoint - using default rate limit from root location
    # location /api/parse is removed - will use default / location with api_limit

    # Health check endpoint (no rate limit)
    location /api/health {
        proxy_pass http://wordpress_parser_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/scrapper.liorizhakidrums.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scrapper.liorizhakidrums.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = scrapper.liorizhakidrums.com) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name scrapper.liorizhakidrums.com;
    return 404;
}
