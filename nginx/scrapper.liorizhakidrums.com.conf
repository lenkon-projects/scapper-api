# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=parse_limit:10m rate=2r/m;

# Upstream configuration
upstream wordpress_parser_api {
    server 127.0.0.1:3000;
    keepalive 32;
}

# HTTP server - will work initially, then certbot will add HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name scrapper.liorizhakidrums.com;

    # Logging
    access_log /var/log/nginx/scrapper.liorizhakidrums.com.access.log;
    error_log /var/log/nginx/scrapper.liorizhakidrums.com.error.log warn;

    # Client body size
    client_max_body_size 10M;

    # Timeouts (long for parsing operations)
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # Root location - general API endpoints
    location / {
        # Rate limiting (general API)
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://wordpress_parser_api;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Keepalive
        proxy_set_header Connection "";
    }

    # Stricter rate limit for parse endpoint
    location /api/parse {
        limit_req zone=parse_limit burst=5 nodelay;

        proxy_pass http://wordpress_parser_api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Health check endpoint (no rate limit)
    location /api/health {
        proxy_pass http://wordpress_parser_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }
}
